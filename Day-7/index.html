<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h3>1. Columns</h3>
    <div class="grid1">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>

    <h3>2. Columns</h3>

    <div class="grid2">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>

    <h3>4. Named lines</h3>
    <div class="grid4">
        <div class="item a">first / second</div>
        <div class="item b">second / third</div>
        <div class="item c">first / end</div>
    </div>

    
</body>
</html>
