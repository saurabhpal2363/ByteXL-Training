<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Student Registration</h1>
    <form action="">
        <!-- name -->
         <p>
            <label for="name">Full Name</label>
            <input type="text" placeholder="Enter your name" id="name" name="fullname">
         </p>

         <!-- email -->
          <p>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="xyz@email.com">
          </p>

          <!-- password -->
          <p>
            <label for="pass">Password</label>
            <input type="pass" id="pass" placeholder="Password">
          </p>

          <!-- phone -->
           <p>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Cont. No" pattern="[6-9][0-9]{9}">
           </p>

           <!-- DOB -->
            <p>
                <label for="dob">DOB</label>
                <input type="date" name="dob" id="dob">
            </p>

            <!-- gender -->
             <fieldset>
                <legend>Gender</legend>
                <input type="radio" name="gender" id="male"value="male">
                <label for="male">Male</label>

                <input type="radio" name="gender" id="female" value="female">
                <label for="female">Female</label>

                <input type="radio" name="gender" id="others" value="others">
                <label for="others">Others</label>
             </fieldset>

             <!-- skill  -->
              <fieldset>
                <legend>Skill</legend>
                <input type="checkbox" name="skill" id="html"value="html">
                <label for="html">html</label>

                <input type="checkbox" name="skill" id="css" value="css">
                <label for="css">css</label>

                <input type="checkbox" name="skill" id="js" value="js">
                <label for="js">js</label>

                <input type="checkbox" name="skill" id="mongoDB" value="mongoDB">
                <label for="mongoDB">mongoDB</label>
             </fieldset>

             <!-- File -->
            <label>Choose a file:</label>
            <input type="file" accept=".pdf">

            <!-- Range -->
             <label>Coding Confidence: </label>
             <input type="range" min="0" max="10" step="1" value="5">

             <!-- Color -->
             <label>Select a color:</label>
            <input type="color" value="#2c6a4d">

    </form>
</body>
</html>
