<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task</title>
</head>
<body>
    <h1>Built-in Form Validation</h1>

    <form action="">
        <p>
            <label for="name">Name (required)</label>
            <input type="text" id="name" required>
        </p>
        
        <p>
            <label for="email">Email (must contain @)</label>
            <input type="email" id="email">
        </p>
        
        <p>
            <label for="username">Username (4 to 12 character)</label>
            <input type="text" id="email" minlength="4" maxlength="12">
        </p>

        <p>
            <label for="pass">Password (at least 8 character)</label>
            <input type="pass" id="pass" minlength="8">
        </p>

        <p>
            <label for="age">Age (18 to 30)</label>
            <input type="number" id="age" min="18" max="30">
        </p>

        <p>
            <label for="marks">Marks (0 to 100, steps of 0.5)</label>
            <input type="number" id="marks" min="0" max="100" step="0.5">
        </p>

        <p>
            <label for="date">Exam date (only in October 2026)</label>
            <input type="date" id="date" min="2026-10-1" max="2026-10-31">
        </p>

        <p>
            <label for="num">Mobile number</label>
            <input type="tel" pattern="[6-9][0-9]{9}">
        </p>

        <p>
            <label for="pin">PIN Code</label>
            <input type="number" pattern="[0-9]{6}">
        </p>

        <p>
            <label for="roll">Roll number (eg. CSE2026)</label>
            <input type="text" pattern="[A-Z]{3}[0-9]{4}">
        </p>
        
    </form>
</body>
</html>
