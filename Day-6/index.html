<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h3>Without Transition (jump)</h3>
    <div class="box rotate"></div>
    <div class="box scale"></div>
    <div class="box move"></div>
    <div class="box skew"></div>

    <h3>With Transition (Smooth)</h3>
    <div class="box rotate smooth"></div>
    <div class="box scale smooth"></div>
    <div class="box move smooth"></div>
    <div class="box skew smooth"></div>

    <h3>Centered with translate</h3>
    <div class="stage">
        <div class="box moving smooth">

        </div>
    </div>

</body>
</html>
